[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-mapper"
version = "1.0.0"
description = "2-D photoluminescence mapper with serpentine scanning via PyVISA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pedro Wolff Bueno Picão", email = "pedrowbueno@gmail.com"},
    {name = "Marina Ribeiro Tonholo"},
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
hardware = ["pyvisa>=1.13", "pyvisa-py>=0.7"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
pl-mapper = "pl_mapper.__main__:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
